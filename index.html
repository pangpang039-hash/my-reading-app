<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#276d98"><meta name="apple-mobile-web-app-capable" content="yes"><title>나의 서재</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#182c3a;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}header{background:#276d98;color:white;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}h1{font-size:26px;margin:0 0 5px}header p{margin:0;opacity:.85;font-size:13px}main{max-width:720px;margin:auto;padding:16px 16px 90px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{flex:1}.tabs .active{background:#276d98;color:white}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;background:#e1e9ef;color:#18394c;font-weight:650}button.primary{background:#276d98;color:white}section{background:white;border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 2px 12px #153c5810}h2{font-size:19px;margin:0 0 14px}.field{margin-bottom:12px}label{display:block;font-size:13px;color:#536575;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #d3dce2;border-radius:10px;padding:12px;background:white;color:#182c3a}textarea{min-height:72px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#eaf3f8;border-radius:13px;padding:12px}.stat strong{font-size:25px;display:block}.stat small{color:#577080}.book{display:flex;gap:12px;border-top:1px solid #edf0f2;padding:14px 0}.cover{width:58px;height:82px;flex-shrink:0;object-fit:cover;border-radius:5px;background:#dbe5eb;display:grid;place-items:center;font-size:25px}.bookinfo{flex:1;min-width:0}.bookinfo strong{display:block}.muted{color:#6a7b88;font-size:13px}.bookinfo p{margin:5px 0;white-space:pre-wrap;font-size:14px}.bookinfo .actions button{padding:7px 10px;font-size:12px}.barrow{display:grid;grid-template-columns:27px 1fr 27px;gap:9px;align-items:center;margin:7px 0;font-size:12px}.track{height:15px;background:#e9eff3;border-radius:4px;overflow:hidden}.bar{height:100%;background:#43b8c0}.hint{font-size:12px;color:#71818b}.empty{text-align:center;padding:22px;color:#71818b}.hidden{display:none} .months{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.month{background:#eef6f9;padding:8px;border-radius:10px;font-size:12px;min-height:62px}.month strong{display:block;font-size:17px}.tinycovers{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}.tinycovers img{width:24px;height:34px;object-fit:cover;border-radius:2px}.pill{font-size:11px;background:#e8f3f8;padding:3px 7px;border-radius:6px;display:inline-block;margin-top:4px}</style></head><body><header><h1>나의 서재</h1><p>오늘의 독서가 내일의 기록이 되도록</p></header><main><nav class="tabs"><button class="active" data-tab="library">내 서재</button><button data-tab="stats">독서 통계</button><button data-tab="backup">백업</button></nav><div id="library"><section><h2 id="formTitle">책 등록하기</h2><div class="field"><label for="onlineQuery">온라인 도서 검색 · 제목 또는 저자</label><div class="actions"><input id="onlineQuery" type="search" placeholder="책 제목이나 저자 입력" style="flex:1;min-width:150px"><button type="button" id="onlineSearch" class="primary">책 찾기</button></div><p class="hint">Google Books 도서 정보를 검색합니다. 결과가 없거나 부정확하면 직접 등록할 수 있어요.</p><div id="onlineResults" aria-live="polite"></div></div><form id="bookForm"><input type="hidden" id="editId"><div class="field"><label for="title">책 제목 *</label><input id="title" required placeholder="책 제목"></div><div class="grid"><div class="field"><label for="author">저자</label><input id="author"></div><div class="field"><label for="publisher">출판사</label><input id="publisher"></div></div><div class="field"><label for="cover">표지 이미지 주소 (선택)</label><input id="cover" type="url" placeholder="https://..."></div><div class="grid"><div class="field"><label for="status">독서 상태</label><select id="status"><option value="want">읽을 책</option><option value="reading">읽는 중</option><option value="done">완독</option></select></div><div class="field"><label for="date">완독 날짜</label><input id="date" type="date"></div></div><div class="field"><label for="notes">밑줄 · 메모</label><textarea id="notes" placeholder="기억하고 싶은 문장이나 생각"></textarea></div><div class="actions"><button class="primary" type="submit">저장하기</button><button type="button" id="cancelEdit" class="hidden">수정 취소</button></div></form></section><section><h2>내 책 목록 <span id="count" class="muted"></span></h2><div class="field"><input id="searchBooks" type="search" placeholder="내 서재 검색 · 제목, 저자, 출판사, 메모" aria-label="내 서재 검색"></div><div class="field"><select id="filter"><option value="all">전체</option><option value="want">읽을 책</option><option value="reading">읽는 중</option><option value="done">완독</option></select></div><div id="books"></div></section></div><div id="stats" class="hidden"><section><h2>전체 독서 기록</h2><div class="grid"><div class="stat"><strong id="totalDone">0</strong><small>완독한 책</small></div><div class="stat"><strong id="totalOwned">0</strong><small>등록한 책</small></div></div></section><section><h2>연도별 독서량</h2><div id="years"></div></section><section><h2>월별 독서량</h2><div class="field"><label for="yearSelect">연도</label><select id="yearSelect"></select></div><div id="monthBars"></div><h2 style="margin-top:18px">월별 책 표지</h2><div id="monthCovers" class="months"></div></section></div><div id="backup" class="hidden"><section><h2>내 기록 보관하기</h2><p class="muted">기록은 이 브라우저에 저장됩니다. 사파리 데이터를 지우거나 기기를 바꾸면 사라질 수 있으니 주기적으로 백업하세요.</p><div class="actions"><button class="primary" id="exportJson">전체 기록 내보내기 (JSON)</button><button id="exportCsv">책 목록 내보내기 (CSV)</button></div></section><section><h2>기록 복원</h2><p class="muted">이 앱에서 내보낸 JSON 파일을 선택하면 현재 기록에 추가합니다. 같은 ID의 기록은 중복되지 않습니다.</p><input type="file" id="importJson" accept=".json,application/json"></section></div></main><script>const KEY='my-library-v1';let books=[];try{let v=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(v))books=v}catch(e){}const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem(KEY,JSON.stringify(books));render()};function show(tab){for(const id of ['library','stats','backup'])$(id).classList.toggle('hidden',id!==tab);document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));let searchSeq=0;
async function searchOnline(){const q=$('onlineQuery').value.trim(),out=$('onlineResults');if(!q){out.textContent='검색어를 입력해 주세요.';return}const seq=++searchSeq;out.textContent='책을 찾는 중…';$('onlineSearch').disabled=true;try{const res=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=15&printType=books');if(!res.ok)throw Error('검색 서비스 응답 오류');const data=await res.json();if(seq!==searchSeq)return;const items=(data.items||[]).map(x=>x.volumeInfo||{});out.replaceChildren();if(!items.length){out.textContent='검색 결과가 없어요. 직접 입력해 주세요.';return}items.forEach(info=>{const div=document.createElement('div');div.className='book';const cover=info.imageLinks?.thumbnail||info.imageLinks?.smallThumbnail||'';if(cover){const img=document.createElement('img');img.className='cover';img.alt='';img.src=cover.replace(/^http:/,'https:');div.append(img)}const content=document.createElement('div');content.className='bookinfo';const title=document.createElement('strong');title.textContent=info.title||'제목 없음';const desc=document.createElement('div');desc.className='muted';desc.textContent=[(info.authors||[]).join(', '),info.publisher||''].filter(Boolean).join(' · ');const btn=document.createElement('button');btn.type='button';btn.textContent='이 책 등록';btn.onclick=()=>{resetForm();$('title').value=info.title||'';$('author').value=(info.authors||[]).join(', ');$('publisher').value=info.publisher||'';$('cover').value=cover.replace(/^http:/,'https:');$('formTitle').scrollIntoView({behavior:'smooth'});$('title').focus()};content.append(title,desc,btn);div.append(content);out.append(div)})}catch(err){if(seq===searchSeq)out.textContent='온라인 검색에 연결하지 못했어요. 인터넷 연결을 확인하거나 직접 등록해 주세요.'}finally{if(seq===searchSeq)$('onlineSearch').disabled=false}}
$('onlineSearch').onclick=searchOnline;$('onlineQuery').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();searchOnline()}});
$('bookForm').onsubmit=e=>{e.preventDefault();const id=$('editId').value;const item={id:id||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())),title:$('title').value.trim(),author:$('author').value.trim(),publisher:$('publisher').value.trim(),cover:$('cover').value.trim(),status:$('status').value,date:$('date').value,notes:$('notes').value};if(!item.title)return;if(item.status==='done'&&!item.date){alert('완독 날짜를 입력해 주세요.');return}if(id)books=books.map(b=>b.id===id?item:b);else books.unshift(item);resetForm();save()};function resetForm(){$('bookForm').reset();$('editId').value='';$('formTitle').textContent='책 등록하기';$('cancelEdit').classList.add('hidden')}$('cancelEdit').onclick=resetForm;$('filter').onchange=render;$('searchBooks').oninput=render;function edit(id){let b=books.find(b=>b.id===id);if(!b)return;for(const k of ['title','author','publisher','cover','status','date','notes'])$(k).value=b[k]||'';$('editId').value=id;$('formTitle').textContent='책 수정하기';$('cancelEdit').classList.remove('hidden');show('library');scrollTo({top:0,behavior:'smooth'})}function remove(id){if(confirm('이 책의 기록을 삭제할까요?')){books=books.filter(b=>b.id!==id);save()}}function render(){let q=$('searchBooks').value.trim().toLocaleLowerCase();let filtered=books.filter(b=>($('filter').value==='all'||b.status===$('filter').value)&&(!q||[b.title,b.author,b.publisher,b.notes].some(v=>String(v||'').toLocaleLowerCase().includes(q))));$('count').textContent=`(${books.length}권)`;$('books').innerHTML=filtered.length?filtered.map(b=>`<div class="book">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="" onerror="this.style.display='none'">`:'<div class="cover">📖</div>'}<div class="bookinfo"><strong>${esc(b.title)}</strong><div class="muted">${esc(b.author)} ${b.publisher?'· '+esc(b.publisher):''}</div><span class="pill">${{want:'읽을 책',reading:'읽는 중',done:'완독'}[b.status]||'읽을 책'}${b.date?' · '+esc(b.date):''}</span>${b.notes?`<p>${esc(b.notes)}</p>`:''}<div class="actions"><button data-edit="${esc(b.id)}">수정</button><button data-delete="${esc(b.id)}">삭제</button></div></div></div>`).join(''):'<div class="empty">'+(q?'검색 결과가 없어요.':'아직 등록한 책이 없어요.')+'</div>';$('books').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('books').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete));const done=books.filter(b=>b.status==='done'&&/^\d{4}-\d{2}-\d{2}$/.test(b.date||''));$('totalDone').textContent=done.length;$('totalOwned').textContent=books.length;const years={};done.forEach(b=>years[b.date.slice(0,4)]=(years[b.date.slice(0,4)]||0)+1);$('years').innerHTML=Object.entries(years).sort((a,b)=>b[0].localeCompare(a[0])).map(([y,n])=>`<div class="barrow"><span>${y}</span><div class="track"><div class="bar" style="width:${100*n/Math.max(...Object.values(years))}%"></div></div><span>${n}</span></div>`).join('')||'<p class="muted">완독 기록이 생기면 표시돼요.</p>';let selected=$('yearSelect').value;const choices=[...new Set([String(new Date().getFullYear()),...Object.keys(years)])].sort((a,b)=>b.localeCompare(a));$('yearSelect').innerHTML=choices.map(y=>`<option value="${y}">${y}년</option>`).join('');$('yearSelect').value=choices.includes(selected)?selected:choices[0];renderMonths(done)}$('yearSelect').onchange=()=>renderMonths(books.filter(b=>b.status==='done'&&/^\d{4}-\d{2}-\d{2}$/.test(b.date||'')));function renderMonths(done){let y=$('yearSelect').value;let counts=Array.from({length:12},(_,i)=>done.filter(b=>b.date.slice(0,7)===`${y}-${String(i+1).padStart(2,'0')}`));let max=Math.max(1,...counts.map(a=>a.length));$('monthBars').innerHTML=counts.map((a,i)=>`<div class="barrow"><span>${i+1}월</span><div class="track"><div class="bar" style="width:${a.length/max*100}%"></div></div><span>${a.length}</span></div>`).join('');$('monthCovers').innerHTML=counts.map((a,i)=>`<div class="month">${i+1}월 <strong>${a.length}권</strong><div class="tinycovers">${a.filter(b=>b.cover).map(b=>`<img src="${esc(b.cover)}" alt="${esc(b.title)}">`).join('')}</div></div>`).join('')}function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000)}$('exportJson').onclick=()=>download(JSON.stringify({app:'my-library-v1',exportedAt:new Date().toISOString(),books},null,2),'나의서재-백업.json','application/json');$('exportCsv').onclick=()=>{let keys=['title','author','publisher','status','date','notes','cover'];let csv=[keys,...books.map(b=>keys.map(k=>b[k]||''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('\ufeff'+csv,'나의서재-책목록.csv','text/csv;charset=utf-8')};$('importJson').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.books)||data.books.some(b=>!b.id||!b.title))throw Error('형식이 맞지 않습니다');const seen=new Set(books.map(b=>b.id));let incoming=data.books.filter(b=>!seen.has(b.id));if(confirm(`${incoming.length}권의 새 기록을 추가할까요?`)){books.push(...incoming);save();alert('복원했습니다.')}}catch(err){alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};render();</script></body></html>
